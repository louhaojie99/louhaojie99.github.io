# Site-specific overrides for hexo-theme-butterfly.
# Theme defaults remain in the npm package so future upgrades stay reviewable.

# Native Butterfly menu syntax: label: URL || icon; group||icon||hide: children.
menu:
  首页: / || fas fa-home
  前端||fas fa-code||hide:
    全部前端: /categories/前端/ || fas fa-folder-open
    HTML: /categories/前端/HTML/ || fab fa-html5
    CSS: /categories/前端/CSS/ || fab fa-css3-alt
    JavaScript: /categories/前端/JavaScript/ || fab fa-js
    TypeScript: /categories/前端/TypeScript/ || fas fa-code
    Node.js: /categories/前端/Nodejs/ || fab fa-node-js
    Next.js: /categories/前端/Nextjs/ || fas fa-code
    工程化: /categories/前端/工程化/ || fas fa-tools
  后端||fas fa-server||hide:
    全部后端: /categories/后端/ || fas fa-folder-open
    Go: /categories/后端/Go/ || fas fa-code
    Python: /categories/后端/Python/ || fab fa-python
    Java: /categories/后端/Java/ || fab fa-java
    MySQL: /categories/后端/MySQL/ || fas fa-database
    PostgreSQL: /categories/后端/PostgreSQL/ || fas fa-database
    Linux: /categories/后端/Linux/ || fab fa-linux
    Docker: /categories/后端/Docker/ || fab fa-docker
  AI||fas fa-robot||hide:
    全部 AI: /categories/AI/ || fas fa-folder-open
    Agent / MCP: /categories/AI/Agent/ || fas fa-project-diagram
    大模型微调: /categories/AI/大模型微调/ || fas fa-microchip
  更多||||hide:
    归档: /archives/ || fas fa-archive
    标签: /tags/ || fas fa-tags
    分类: /categories/ || fas fa-folder-open
    相册: /photo/ || fas fa-image
    音乐: /music/ || fas fa-music
    电影: /movies/ || fas fa-video
    友链: /link/ || fas fa-link
  关于: /about/ || fas fa-heart card-announcement-animation

# Site archive supplements, merging native and legacy category membership.
# These collect legacy categories without changing existing article/category URLs.
navigation_archives:
  - category: [前端]
    source_prefixes: [frontend/]
    match_categories: [Nodejs, Node.js, nodejs, node, Nextjs, Next.js, nextjs]
  - category: [前端, HTML]
    match_categories: [HTML]
  - category: [前端, CSS]
    match_categories: [CSS, css]
  - category: [前端, JavaScript]
    match_categories: [JavaScript, Ajax]
  - category: [前端, TypeScript]
    match_categories: [TypeScript]
  - category: [前端, Nodejs]
    match_categories: [Nodejs, Node.js, nodejs, node]
    source_prefixes: [frontend/nodejs/]
  - category: [前端, Nextjs]
    match_categories: [Nextjs, Next.js, nextjs]
    source_prefixes: [frontend/nextjs/]
  - category: [前端, 工程化]
    match_categories: [pnpm]
  - category: [后端]
    source_prefixes: [backend/, devops/]
    match_categories: [MySQL, mysql, PostgreSQL, postgresql, Postgres, postgres, Java, java]
  - category: [后端, Go]
    match_categories: [Go]
  - category: [后端, Python]
    match_categories: [Python]
  - category: [后端, Java]
    match_categories: [Java, java]
    source_prefixes: [backend/java/]
  - category: [后端, MySQL]
    match_categories: [MySQL, mysql]
    source_prefixes: [backend/mysql/]
  - category: [后端, PostgreSQL]
    match_categories: [PostgreSQL, postgresql, Postgres, postgres]
    source_prefixes: [backend/postgresql/]
  - category: [后端, Linux]
    match_categories: [Linux]
  - category: [后端, Docker]
    match_categories: [Docker]
  - category: [AI]
  - category: [AI, Agent]
    source_prefixes: [ai/agent/]
  - category: [AI, 大模型微调]
    source_prefixes: [tool/硬件算力/]

code_blocks:
  theme: light
  macStyle: true
  copy: true
  language: true
  shrink: false

search:
  use: local_search

favicon: /img/favicon.png

avatar:
  img: /img/avatar.png
  effect: false

index_img: https://pic.netbian.com/uploads/allimg/241128/180832-173278851272ba.jpg
archive_img: https://tva1.sinaimg.cn/large/832afe33ly1gbi1ubygflj21kw11y460.jpg
footer_img: true

index_layout: 1

reward:
  enable: false
  QR_code:
    - img: /img/wechat.jpg
      link:
      text: 微信
    - img: /img/alipay.jpg
      link:
      text: 支付宝

footer:
  owner:
    enable: true
    since: 2017
  copyright:
    enable: false
  custom_text: <div>嗨，欢迎来到我的博客，希望能帮助到您！</div>

subtitle:
  enable: true
  effect: true
  source: false
  sub:
    - 科比·布莱恩特（Kobe Bryant）
    - "你知道洛杉矶林晨4点钟是什么样子吗?"

aside:
  card_author:
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/louhaojie99
  card_announcement:
    enable: true
    content: 常常在思考, 喜欢做的事.
  card_newest_comments:
    enable: true
    limit: 6
    storage: 10
    avatar: true
  card_webinfo:
    runtime_date: 01/09/2017 00:00:00

translate:
  enable: true
  default: 繁
  defaultEncoding: 2
  translateDelay: 0
  msgToTraditionalChinese: "繁"
  msgToSimplifiedChinese: "簡"

readmode: true

theme_color:
  enable: true
  main: "#49B1F5"
  paginator: "#00c4b6"
  button_hover: "#FF7242"
  text_selection: "#00c4b6"
  link_color: "#49b1f5"
  meta_color: "#858585"
  hr_color: "#A4D8FA"
  code_foreground: "#F47466"
  code_background: "rgba(27, 31, 35, .05)"
  toc_color: "#00c4b6"
  blockquote_padding_color: "#49b1f5"
  blockquote_background_color: "#49b1f5"

activate_power_mode:
  enable: true
  colorful: true
  shake: true
  mobile: false

canvas_nest:
  enable: true
  color: "0,0,255"
  opacity: 0.7
  zIndex: -1
  count: 99
  mobile: false

clickShowText:
  enable: true
  text:
    - 富强
    - 民主
    - 文明
    - 和谐
    - 自由
    - 平等
    - 公正
    - 法治
  fontSize: 15px
  random: true
  mobile: false

pjax:
  enable: true
  exclude:
    - /music/
    - /no-pjax/

instantpage: true

lazyload:
  enable: true
  native: true
  field: site

inject:
  head:
    - <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/static-butterfly/dist/css/index.min.css">
    - <link rel="stylesheet" href="/css/custom.css?v=20260918-compact6">
    - <link rel="stylesheet" href="/css/navigation.css?v=20261004-native">
  bottom:
    - <script src="/js/live2d.js"></script>
    - <script src="/js/navigation.js?v=20261004-native" defer></script>
