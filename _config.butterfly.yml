# Site-specific overrides for hexo-theme-butterfly.
# Theme defaults remain in the npm package so future upgrades stay reviewable.

# Native Butterfly menu syntax: label: URL || icon; group||icon||hide: children.
menu:
  首页: /
  前端||||hide:
    全部: /categories/前端/
    HTML: /categories/前端/HTML/
    CSS: /categories/前端/CSS/
    JavaScript: /categories/前端/JavaScript/
    TypeScript: /categories/前端/TypeScript/
    Node.js: /categories/前端/Nodejs/
    Next.js: /categories/前端/Nextjs/
  后端||||hide:
    全部: /categories/后端/
    Python: /categories/后端/Python/
    Go: /categories/后端/Go/
    Java: /categories/后端/Java/
    MySQL: /categories/后端/MySQL/
    PostgreSQL: /categories/后端/PostgreSQL/
  AI||||hide:
    全部: /categories/AI/
    Agent / MCP: /categories/AI/Agent/
    微调与算力: /categories/AI/大模型微调/
  工具||||hide:
    全部: /categories/工程实践/
    Git: /categories/工程实践/git/
    包管理: /categories/工程实践/包管理/
    Linux: /categories/工程实践/Linux/
    Docker: /categories/工程实践/Docker/
  随笔: /categories/生活/随笔/
  更多||||hide:
    归档: /archives/
    标签: /tags/
    分类: /categories/
    相册: /photo/
    音乐: /music/
    电影: /movies/
    友链: /link/
    关于: /about/

# Site archive supplements, merging native and legacy category membership.
# Keep old post/category URLs while organizing navigation by development domain.
navigation_archives:
  - category: [前端]
    source_prefixes: [frontend/html/, frontend/css/, frontend/javascript/, frontend/typescript/, frontend/nodejs/, frontend/nextjs/]
    match_categories: [HTML, CSS, css, JavaScript, Ajax, TypeScript, Nodejs, Node.js, nodejs, node, Nextjs, Next.js, nextjs]
  - category: [前端, HTML]
    match_categories: [HTML]
  - category: [前端, CSS]
    match_categories: [CSS, css]
  - category: [前端, JavaScript]
    match_categories: [JavaScript, Ajax]
  - category: [前端, TypeScript]
    match_categories: [TypeScript]
  - category: [前端, Nodejs]
    match_categories: [Nodejs, Node.js, nodejs, node]
    source_prefixes: [frontend/nodejs/]
  - category: [前端, Nextjs]
    match_categories: [Nextjs, Next.js, nextjs]
    source_prefixes: [frontend/nextjs/]
  - category: [后端]
    source_prefixes: [backend/]
    match_categories: [MySQL, mysql, PostgreSQL, postgresql, Postgres, postgres, Java, java]
  - category: [后端, Go]
    match_categories: [Go]
  - category: [后端, Python]
    match_categories: [Python]
  - category: [后端, Java]
    match_categories: [Java, java]
    source_prefixes: [backend/java/]
  - category: [后端, MySQL]
    match_categories: [MySQL, mysql]
    source_prefixes: [backend/mysql/]
  - category: [后端, PostgreSQL]
    match_categories: [PostgreSQL, postgresql, Postgres, postgres]
    source_prefixes: [backend/postgresql/]
  - category: [AI]
    source_prefixes: [ai/]
  - category: [AI, Agent]
    source_prefixes: [ai/agent/]
  - category: [AI, 大模型微调]
    source_prefixes: [ai/hardware/]
  - category: [工程实践]
    match_categories: [git, Git, pnpm, Linux, Docker]
    source_prefixes: [engineering/, tool/git/, tool/pnpm/, devops/]
  - category: [工程实践, Git]
    match_categories: [git, Git]
    source_prefixes: [tool/git/]
  - category: [工程实践, 包管理]
    match_categories: [pnpm]
    source_prefixes: [tool/pnpm/]
  - category: [工程实践, Linux]
    match_categories: [Linux]
    source_prefixes: [devops/linux/]
  - category: [工程实践, Docker]
    match_categories: [Docker]
    source_prefixes: [devops/docker/]

  # Compatibility archives retained for existing links, outside the main menu.
  - category: [工程实践, 开发工具]
    source_prefixes: [tool/shell/]
  - category: [工程实践, 博客搭建]
    match_categories: [Docs文檔]
    source_prefixes: [blog/hexo/]

  - category: [后端, Nodejs]
    match_categories: [Nodejs, Node.js, nodejs]
    source_prefixes: [backend/nodejs/, frontend/nodejs/]
  - category: [前端, 工程化]
    match_categories: [pnpm]
  - category: [后端, Linux]
    match_categories: [Linux]
  - category: [后端, Docker]
    match_categories: [Docker]
  - category: [Git]
    match_categories: [git, Git]
    source_prefixes: [tool/git/]

code_blocks:
  theme: light
  macStyle: true
  copy: true
  language: true
  shrink: false

search:
  use: local_search

favicon: /img/favicon.png

avatar:
  img: /img/avatar.png
  effect: false

index_img: https://pic.netbian.com/uploads/allimg/241128/180832-173278851272ba.jpg
archive_img: https://tva1.sinaimg.cn/large/832afe33ly1gbi1ubygflj21kw11y460.jpg
footer_img: true

index_layout: 1

reward:
  enable: false
  QR_code:
    - img: /img/wechat.jpg
      link:
      text: 微信
    - img: /img/alipay.jpg
      link:
      text: 支付宝

footer:
  owner:
    enable: true
    since: 2017
  copyright:
    enable: false
  custom_text: |
    <nav class="footer-links" aria-label="更多页面">
      <a href="/archives/">归档</a>
      <a href="/tags/">标签</a>
      <a href="/categories/">分类</a>
      <a href="/photo/">相册</a>
      <a href="/music/">音乐</a>
      <a href="/movies/">电影</a>
      <a href="/link/">友链</a>
    </nav>
    <div>嗨，欢迎来到我的博客，希望能帮助到您！</div>

subtitle:
  enable: true
  effect: true
  source: false
  sub:
    - 科比·布莱恩特（Kobe Bryant）
    - "你知道洛杉矶林晨4点钟是什么样子吗?"

aside:
  card_author:
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/louhaojie99
  card_announcement:
    enable: true
    content: 常常在思考, 喜欢做的事.
  card_newest_comments:
    enable: true
    limit: 6
    storage: 10
    avatar: true
  card_webinfo:
    runtime_date: 01/09/2017 00:00:00

translate:
  enable: true
  default: 繁
  defaultEncoding: 2
  translateDelay: 0
  msgToTraditionalChinese: "繁"
  msgToSimplifiedChinese: "簡"

readmode: true

theme_color:
  enable: true
  main: "#49B1F5"
  paginator: "#00c4b6"
  button_hover: "#FF7242"
  text_selection: "#00c4b6"
  link_color: "#49b1f5"
  meta_color: "#858585"
  hr_color: "#A4D8FA"
  code_foreground: "#F47466"
  code_background: "rgba(27, 31, 35, .05)"
  toc_color: "#00c4b6"
  blockquote_padding_color: "#49b1f5"
  blockquote_background_color: "#49b1f5"

activate_power_mode:
  enable: true
  colorful: true
  shake: true
  mobile: false

canvas_nest:
  enable: true
  color: "0,0,255"
  opacity: 0.7
  zIndex: -1
  count: 99
  mobile: false

clickShowText:
  enable: true
  text:
    - 富强
    - 民主
    - 文明
    - 和谐
    - 自由
    - 平等
    - 公正
    - 法治
  fontSize: 15px
  random: true
  mobile: false

pjax:
  enable: true
  exclude:
    - /music/
    - /no-pjax/

instantpage: true

lazyload:
  enable: true
  native: true
  field: site

inject:
  head:
    - <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/static-butterfly/dist/css/index.min.css">
    - <link rel="stylesheet" href="/css/custom.css?v=20260918-compact6">
    - <link rel="stylesheet" href="/css/navigation.css?v=20261004-compact">
    - <link rel="stylesheet" href="/css/movies.css?v=20261004-focus">
  bottom:
    - <script src="/js/live2d.js"></script>
    - <script src="/js/navigation.js?v=20261004-compact" defer></script>
    - <script src="/js/movies.js?v=20261004-list" defer></script>
