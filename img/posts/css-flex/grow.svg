<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">flex-grow：分的是“增加的宽度”</title><desc id="desc">容器 600px；三项 basis 均为 100px；grow 权重为 1 : 2 : 1。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
<rect x="0" y="0" width="800" height="450" rx="16" fill="#fff" stroke="none" stroke-width="2"/>
<text x="32" y="42" font-size="26" fill="#172b4d" text-anchor="start" font-weight="700">flex-grow：分的是“增加的宽度”</text>
<text x="32" y="74" font-size="17" fill="#536580" text-anchor="start" font-weight="400">容器 600px；三项 basis 均为 100px；grow 权重为 1 : 2 : 1。</text>
<text x="32" y="120" font-size="20" fill="#172b4d" text-anchor="start" font-weight="600">分配前</text>
<rect x="100" y="138" width="100" height="60" rx="8" fill="#2864dc" stroke="none" stroke-width="2"/>
<text x="150.0" y="175.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">A 100</text>
<rect x="200" y="138" width="100" height="60" rx="8" fill="#2864dc" stroke="none" stroke-width="2"/>
<text x="250.0" y="175.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">B 100</text>
<rect x="300" y="138" width="100" height="60" rx="8" fill="#2864dc" stroke="none" stroke-width="2"/>
<text x="350.0" y="175.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">C 100</text>
<rect x="400" y="138" width="300" height="60" rx="8" fill="#fff4df" stroke="#b75d09" stroke-width="2" stroke-dasharray="6 5"/>
<text x="550" y="174" font-size="20" fill="#b75d09" text-anchor="middle" font-weight="400">剩余 300px</text>
<text x="32" y="243" font-size="20" fill="#172b4d" text-anchor="start" font-weight="600">分配后</text>
<rect x="100" y="260" width="100" height="66" rx="0" fill="#2864dc" stroke="none" stroke-width="2"/>
<rect x="200" y="260" width="75" height="66" rx="0" fill="#087f8c" stroke="none" stroke-width="2"/>
<text x="150" y="300" font-size="20" fill="white" text-anchor="middle" font-weight="400">100</text>
<text x="237.5" y="300" font-size="19" fill="white" text-anchor="middle" font-weight="400">+75</text>
<text x="187.5" y="356" font-size="20" fill="#172b4d" text-anchor="middle" font-weight="600">A = 175px</text>
<rect x="275" y="260" width="100" height="66" rx="0" fill="#2864dc" stroke="none" stroke-width="2"/>
<rect x="375" y="260" width="150" height="66" rx="0" fill="#087f8c" stroke="none" stroke-width="2"/>
<text x="325" y="300" font-size="20" fill="white" text-anchor="middle" font-weight="400">100</text>
<text x="450.0" y="300" font-size="19" fill="white" text-anchor="middle" font-weight="400">+150</text>
<text x="400.0" y="356" font-size="20" fill="#172b4d" text-anchor="middle" font-weight="600">B = 250px</text>
<rect x="525" y="260" width="100" height="66" rx="0" fill="#2864dc" stroke="none" stroke-width="2"/>
<rect x="625" y="260" width="75" height="66" rx="0" fill="#087f8c" stroke="none" stroke-width="2"/>
<text x="575" y="300" font-size="20" fill="white" text-anchor="middle" font-weight="400">100</text>
<text x="662.5" y="300" font-size="19" fill="white" text-anchor="middle" font-weight="400">+75</text>
<text x="612.5" y="356" font-size="20" fill="#172b4d" text-anchor="middle" font-weight="600">C = 175px</text>
<text x="32" y="400" font-size="20" fill="#087f8c" text-anchor="start" font-weight="400">300 ÷ (1 + 2 + 1) = 75px / 份</text>
<text x="32" y="430" font-size="18" fill="#536580" text-anchor="start" font-weight="400">蓝色是原始尺寸，绿色是增加的空间；最终宽度不是 1 : 2 : 1。</text>
</svg>
