<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
<title id="title">把“操作区靠右”交给剩余空间</title><desc id="desc">项目沿一行排列，按钮前的 auto 外边距吸收剩余宽度。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
<rect x="0" y="0" width="800" height="260" rx="16" fill="#fff" stroke="none" stroke-width="2"/>
<text x="32" y="42" font-size="26" fill="#172b4d" text-anchor="start" font-weight="700">把“操作区靠右”交给剩余空间</text>
<text x="32" y="74" font-size="17" fill="#536580" text-anchor="start" font-weight="400">项目沿一行排列，按钮前的 auto 外边距吸收剩余宽度。</text>
<rect x="32" y="110" width="736" height="84" rx="8" fill="#eef3fa" stroke="none" stroke-width="2"/>
<rect x="48" y="126" width="80" height="52" rx="8" fill="#2864dc" stroke="none" stroke-width="2"/>
<text x="88.0" y="159.0" font-size="20" fill="white" text-anchor="middle" font-weight="600">标识</text>
<rect x="140" y="126" width="100" height="52" rx="8" fill="#087f8c" stroke="none" stroke-width="2"/>
<text x="190.0" y="159.0" font-size="20" fill="white" text-anchor="middle" font-weight="600">导航</text>
<rect x="252" y="126" width="360" height="52" rx="8" fill="#fff4df" stroke="#b75d09" stroke-width="2" stroke-dasharray="6 5"/>
<text x="432" y="159" font-size="19" fill="#b75d09" text-anchor="middle" font-weight="400">自动占用剩余空间</text>
<rect x="624" y="126" width="128" height="52" rx="8" fill="#8357c5" stroke="none" stroke-width="2"/>
<text x="688.0" y="159.0" font-size="20" fill="white" text-anchor="middle" font-weight="600">登录按钮</text>
<text x="32" y="230" font-size="18" fill="#536580" text-anchor="start" font-weight="400">align-items: center  ·  margin-inline-start: auto</text>
</svg>
