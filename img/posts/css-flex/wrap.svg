<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">空间不够：收缩，还是换行？</title><desc id="desc">同一个 480px 容器；每项 flex-basis: 140px，gap: 12px。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
<rect x="0" y="0" width="800" height="500" rx="16" fill="#fff" stroke="none" stroke-width="2"/>
<text x="32" y="42" font-size="26" fill="#172b4d" text-anchor="start" font-weight="700">空间不够：收缩，还是换行？</text>
<text x="32" y="74" font-size="17" fill="#536580" text-anchor="start" font-weight="400">同一个 480px 容器；每项 flex-basis: 140px，gap: 12px。</text>
<text x="32" y="126" font-size="21" fill="#172b4d" text-anchor="start" font-weight="600">nowrap + shrink: 1：允许收缩</text>
<rect x="32" y="144" width="480" height="126" rx="8" fill="#eef3fa" stroke="none" stroke-width="2"/>
<text x="32" y="296" font-size="21" fill="#172b4d" text-anchor="start" font-weight="600">wrap：容纳不下的项目进入下一行</text>
<rect x="32" y="314" width="480" height="126" rx="8" fill="#eef3fa" stroke="none" stroke-width="2"/>
<rect x="32" y="164" width="111" height="60" rx="8" fill="#2864dc" stroke="none" stroke-width="2"/>
<text x="87.5" y="201.0" font-size="20" fill="white" text-anchor="middle" font-weight="600">1</text>
<rect x="155" y="164" width="111" height="60" rx="8" fill="#2864dc" stroke="none" stroke-width="2"/>
<text x="210.5" y="201.0" font-size="20" fill="white" text-anchor="middle" font-weight="600">2</text>
<rect x="278" y="164" width="111" height="60" rx="8" fill="#2864dc" stroke="none" stroke-width="2"/>
<text x="333.5" y="201.0" font-size="20" fill="white" text-anchor="middle" font-weight="600">3</text>
<rect x="401" y="164" width="111" height="60" rx="8" fill="#2864dc" stroke="none" stroke-width="2"/>
<text x="456.5" y="201.0" font-size="20" fill="white" text-anchor="middle" font-weight="600">4</text>
<text x="536" y="183" font-size="18" fill="#2864dc" text-anchor="start" font-weight="400">每项缩到 111px</text>
<text x="536" y="215" font-size="17" fill="#536580" text-anchor="start" font-weight="400">内容允许收缩时</text>
<rect x="32" y="330" width="140" height="46" rx="8" fill="#087f8c" stroke="none" stroke-width="2"/>
<text x="102.0" y="360.0" font-size="20" fill="white" text-anchor="middle" font-weight="600">1</text>
<rect x="184" y="330" width="140" height="46" rx="8" fill="#087f8c" stroke="none" stroke-width="2"/>
<text x="254.0" y="360.0" font-size="20" fill="white" text-anchor="middle" font-weight="600">2</text>
<rect x="336" y="330" width="140" height="46" rx="8" fill="#087f8c" stroke="none" stroke-width="2"/>
<text x="406.0" y="360.0" font-size="20" fill="white" text-anchor="middle" font-weight="600">3</text>
<rect x="32" y="388" width="140" height="46" rx="8" fill="#087f8c" stroke="none" stroke-width="2"/>
<text x="102.0" y="418.0" font-size="20" fill="white" text-anchor="middle" font-weight="600">4</text>
<text x="536" y="352" font-size="18" fill="#087f8c" text-anchor="start" font-weight="400">前 3 项：444px</text>
<text x="536" y="389" font-size="18" fill="#087f8c" text-anchor="start" font-weight="400">第 4 项另起一行</text>
<text x="32" y="478" font-size="17" fill="#536580" text-anchor="start" font-weight="400">nowrap 不保证不溢出：最小尺寸限制或禁止收缩都可能让项目超出容器。</text>
</svg>
