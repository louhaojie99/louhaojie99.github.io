<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-labelledby="title desc">
<title id="title">flex-shrink：按基准尺寸加权收缩</title><desc id="desc">容器 300px；A 的 basis 为 200px，B 为 400px；shrink 均为 1。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
<rect x="0" y="0" width="800" height="470" rx="16" fill="#fff" stroke="none" stroke-width="2"/>
<text x="32" y="42" font-size="26" fill="#172b4d" text-anchor="start" font-weight="700">flex-shrink：按基准尺寸加权收缩</text>
<text x="32" y="74" font-size="17" fill="#536580" text-anchor="start" font-weight="400">容器 300px；A 的 basis 为 200px，B 为 400px；shrink 均为 1。</text>
<text x="32" y="120" font-size="20" fill="#172b4d" text-anchor="start" font-weight="600">收缩前：总宽 600px</text>
<rect x="100" y="144" width="200" height="64" rx="8" fill="#2864dc" stroke="none" stroke-width="2"/>
<text x="200.0" y="183.0" font-size="20" fill="white" text-anchor="middle" font-weight="600">A 200px</text>
<rect x="300" y="144" width="400" height="64" rx="8" fill="#8357c5" stroke="none" stroke-width="2"/>
<text x="500.0" y="183.0" font-size="20" fill="white" text-anchor="middle" font-weight="600">B 400px</text>
<line x1="400" y1="135" x2="400" y2="225" stroke="#b75d09" stroke-width="2" stroke-dasharray="6 5"/>
<text x="408" y="239" font-size="18" fill="#b75d09" text-anchor="start" font-weight="400">← 容器的 300px 边界</text>
<text x="32" y="282" font-size="20" fill="#172b4d" text-anchor="start" font-weight="600">收缩后：总宽 300px</text>
<rect x="100" y="302" width="100" height="64" rx="8" fill="#2864dc" stroke="none" stroke-width="2"/>
<text x="150.0" y="341.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">A 100</text>
<rect x="200" y="302" width="200" height="64" rx="8" fill="#8357c5" stroke="none" stroke-width="2"/>
<text x="300.0" y="341.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">B 200</text>
<line x1="400" y1="291" x2="400" y2="378" stroke="#b75d09" stroke-width="2" stroke-dasharray="6 5"/>
<text x="32" y="412" font-size="20" fill="#172b4d" text-anchor="start" font-weight="400">缩减 300px，权重 200 : 400 = 1 : 2</text>
<text x="32" y="445" font-size="18" fill="#536580" text-anchor="start" font-weight="400">A 减少 100px，B 减少 200px；前提是项目允许收缩到目标尺寸。</text>
</svg>
