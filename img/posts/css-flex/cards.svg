<svg xmlns="http://www.w3.org/2000/svg" width="800" height="590" viewBox="0 0 800 590" role="img" aria-labelledby="title desc">
<title id="title">响应式卡片：换行与内部纵向布局</title><desc id="desc">外层 flex-wrap: wrap；卡片内使用 column + margin-top: auto。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
<rect x="0" y="0" width="800" height="590" rx="16" fill="#fff" stroke="none" stroke-width="2"/>
<text x="32" y="42" font-size="26" fill="#172b4d" text-anchor="start" font-weight="700">响应式卡片：换行与内部纵向布局</text>
<text x="32" y="74" font-size="17" fill="#536580" text-anchor="start" font-weight="400">外层 flex-wrap: wrap；卡片内使用 column + margin-top: auto。</text>
<text x="32" y="119" font-size="21" fill="#172b4d" text-anchor="start" font-weight="600">宽屏：同一行等高，链接贴近底部</text>
