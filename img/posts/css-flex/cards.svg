<text x="50" y="342" font-size="19" fill="#2864dc" text-anchor="start" font-weight="400">阅读说明 →</text>
<rect x="284" y="142" width="232" height="230" rx="8" fill="#f5f8fd" stroke="#c7d7ed" stroke-width="2"/>
<text x="302" y="179" font-size="21" fill="#172b4d" text-anchor="start" font-weight="600">弹性尺寸</text>
<rect x="302" y="201" width="170" height="9" rx="4" fill="#c4d0e2" stroke="none" stroke-width="2"/>
<rect x="302" y="224" width="135" height="9" rx="4" fill="#c4d0e2" stroke="none" stroke-width="2"/>
<rect x="302" y="247" width="170" height="9" rx="4" fill="#c4d0e2" stroke="none" stroke-width="2"/>
<rect x="302" y="270" width="135" height="9" rx="4" fill="#c4d0e2" stroke="none" stroke-width="2"/>
<text x="302" y="342" font-size="19" fill="#2864dc" text-anchor="start" font-weight="400">阅读说明 →</text>
<rect x="536" y="142" width="232" height="230" rx="8" fill="#f5f8fd" stroke="#c7d7ed" stroke-width="2"/>
<text x="554" y="179" font-size="21" fill="#172b4d" text-anchor="start" font-weight="600">自动换行</text>
<rect x="554" y="201" width="170" height="9" rx="4" fill="#c4d0e2" stroke="none" stroke-width="2"/>
<rect x="554" y="224" width="135" height="9" rx="4" fill="#c4d0e2" stroke="none" stroke-width="2"/>
<text x="554" y="342" font-size="19" fill="#2864dc" text-anchor="start" font-weight="400">阅读说明 →</text>
<line x1="32" y1="350" x2="768" y2="350" stroke="#b75d09" stroke-width="2" stroke-dasharray="6 5"/>
<text x="32" y="412" font-size="21" fill="#172b4d" text-anchor="start" font-weight="600">窄屏：卡片依次换行，每行独立分配宽度</text>
<rect x="32" y="433" width="440" height="34" rx="8" fill="#2864dc" stroke="none" stroke-width="2"/>
<text x="252.0" y="457.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">排列方向</text>
<rect x="32" y="477" width="440" height="34" rx="8" fill="#087f8c" stroke="none" stroke-width="2"/>
<text x="252.0" y="501.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">弹性尺寸</text>
<rect x="32" y="521" width="440" height="34" rx="8" fill="#8357c5" stroke="none" stroke-width="2"/>
<text x="252.0" y="545.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">自动换行</text>
<text x="502" y="474" font-size="18" fill="#536580" text-anchor="start" font-weight="400">此处为结构示意</text>
<text x="502" y="505" font-size="18" fill="#536580" text-anchor="start" font-weight="400">实际高度由内容决定</text>
